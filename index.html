<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      // Optional: Configure Tailwind
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#007bff', // Example primary color
              secondary: '#6c757d', // Example secondary color
            },
            animation: {
              spin: 'spin 1s linear infinite',
            },
            keyframes: {
               spin: {
                 '0%': { transform: 'rotate(0deg)' },
                 '100%': { transform: 'rotate(360deg)' },
               }
            }
          }
        }
      }
    </script>
    <style>
      /* Keep pre formatting */
       pre {
          white-space: pre-wrap;
          white-space: -moz-pre-wrap;
          white-space: -pre-wrap;
          white-space: -o-pre-wrap;
          word-wrap: break-word;
      }
      /* Custom progress dot styles if Tailwind isn't enough */
      .progressDot {
          @apply w-2.5 h-2.5 rounded-full bg-gray-300 mx-1 transition-colors duration-300;
      }
      .progressDot.active {
          @apply bg-blue-500;
      }
    </style>
</head>
<body class="bg-gray-100">
    <div class="App container mx-auto p-6 md:p-10 max-w-3xl font-['Roboto',_sans-serif]">
        <h1 class="text-4xl font-bold mb-8 text-center text-gray-800">Contract Generator</h1>

        <!-- API Key Management Section -->
        <div id="apiKeySection" class="bg-blue-50 border border-blue-300 text-blue-800 px-4 py-4 rounded-lg relative mb-8 shadow-sm" role="alert">
            <div class="flex items-center mb-3">
                <svg class="w-6 h-6 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <strong class="font-semibold">OpenAI API Key Required</strong>
            </div>
            <p class="text-sm mb-3">Please enter your OpenAI API key. It is stored securely in your browser's local storage and never sent anywhere else except directly to OpenAI.</p>
             <div class="flex flex-col sm:flex-row items-stretch sm:items-center">
                <input type="password" id="apiKeyInput" placeholder="Enter your OpenAI API Key (sk-...)" class="flex-grow shadow-sm appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent mb-2 sm:mb-0 sm:mr-2">
                <button onclick="saveApiKey()" class="bg-blue-500 hover:bg-blue-600 transition-colors duration-200 text-white font-semibold py-2 px-5 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-1 whitespace-nowrap shadow-sm">Save Key</button>
            </div>
            <p id="apiKeyStatus" class="text-sm mt-2 font-medium"></p>
        </div>
        <!-- End API Key Management Section -->

        <div id="questionContainer" class="bg-white shadow-lg rounded-lg p-6 md:p-8 mb-8" style="display: none;">
            <div id="progressIndicator" class="flex justify-center mb-6">
                <!-- Progress dots will be added dynamically here -->
            </div>
            <h2 id="question" class="text-2xl mb-5 text-center font-medium text-gray-700"></h2>
            <textarea id="answer" rows="5" class="shadow-sm appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent mb-6" placeholder="Your answer here..."></textarea>
            <div class="flex items-center justify-between flex-wrap gap-4">
                 <button id="previousBtn" onclick="handlePrevious()" class="bg-gray-500 hover:bg-gray-600 transition-colors duration-200 text-white font-semibold py-2 px-5 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">Previous</button>
                 <div class="flex gap-4"> <!-- Wrapper for right-aligned buttons -->
                    <button id="nextBtn" onclick="handleNext()" class="bg-blue-500 hover:bg-blue-600 transition-colors duration-200 text-white font-semibold py-2 px-5 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-1 shadow-sm">Next</button>
                    <button id="submitBtn" onclick="handleSubmit()" style="display: none;" class="bg-green-500 hover:bg-green-600 transition-colors duration-200 text-white font-semibold py-2 px-5 rounded-md focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-1 shadow-sm">Generate Contract</button>
                 </div>
            </div>
        </div>

        <div id="contractContainer" style="display: none;" class="bg-white shadow-lg rounded-lg p-6 md:p-8 mb-4">
            <h2 class="text-3xl font-semibold mb-6 text-center text-gray-800">Generated Contract</h2>
            <div id="loadingIndicator" style="display: none;" class="flex flex-col items-center justify-center mb-6 text-gray-600">
                <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500 mb-3"></div>
                <p class="text-lg font-medium">Generating contract...</p>
            </div>
            <!-- Apply Tailwind prose for better text formatting if needed, or keep pre -->
            <pre id="contract" class="bg-gray-50 p-4 rounded-md border border-gray-200 text-gray-800 text-sm leading-relaxed"></pre>
            <div class="mt-8 text-center">
                 <button id="downloadBtn" onclick="downloadPDF()" class="bg-purple-500 hover:bg-purple-600 transition-colors duration-200 text-white font-semibold py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-1 shadow-sm inline-flex items-center">
                     <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                     Download as PDF
                 </button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
